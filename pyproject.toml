[project]
name = "fission"
version = "0.1.0"
description = "Lattice physics from scratch: ENDF/B-VIII.1 processing, pin-cell transport, few-group constants"
authors = [
    { name = "Steve Marin", email = "steve.marin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
]

[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Python package in src/fission; the Rust crate (Cargo.toml, rust/src) builds fission._rust
python-source = "src"
module-name = "fission._rust"

[tool.uv]
# rebuild the extension whenever Rust sources change
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "rust/**/*.rs" },
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running physics checks (run with `make test-slow`)"]
addopts = "-m 'not slow'"
