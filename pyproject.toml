[project]
name = "nodal"
version = "0.1.0"
description = "Multigroup 3D Cartesian nodal diffusion code (NEM + CMFD)"
authors = [
    { name = "Steve Marin", email = "steve.marin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
