[project]
name = "nodal"
version = "0.1.0"
description = "Multigroup 3D Cartesian nodal diffusion code (NEM + CMFD)"
authors = [
    { name = "Steve Marin", email = "steve.marin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
]

[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Python package in src/nodal; the Rust crate (Cargo.toml, rust/src) builds nodal._rust
python-source = "src"
module-name = "nodal._rust"

[tool.uv]
# rebuild the extension whenever Rust sources change
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "rust/**/*.rs" },
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running physics checks (run with `make test-slow`)"]
addopts = "-m 'not slow'"
