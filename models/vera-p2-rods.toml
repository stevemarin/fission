[states.2G]
fuel_temperature = 600.0
moderator_temperature = 600.0
moderator_density = 0.743
boron_ppm = 1300
reference = { keff = 0.847695, sigma = 0.000025, source = "Table P2-5: CE KENO-VI, ENDF/B-VII.0, 24 AIC (lattice aic_24)" }

[states.2H]
fuel_temperature = 600.0
moderator_temperature = 600.0
moderator_density = 0.743
boron_ppm = 1300
reference = { keff = 0.788221, sigma = 0.000025, source = "Table P2-5: CE KENO-VI, ENDF/B-VII.0, 24 B4C (lattice b4c_24)" }
