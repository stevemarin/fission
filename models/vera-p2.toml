# VERA Core Physics Benchmark Progression Problem 2: one Westinghouse 17x17
# fuel lattice at hot zero power, beginning of life (2D, reflective on all
# sides), cases 2A-2D (no poisons).
#
# Source: A. T. Godfrey, "VERA Core Physics Benchmark Progression Problem
# Specifications", CASL-U-2012-0131-004 Rev. 4 (2014), free at
# https://corephysics.com/docs/CASL-U-2012-0131-004.pdf
#   Table 1     rod geometry
#   Table 2     guide and instrument tubes, assembly pitch 21.50 cm,
#               inter-assembly half gap 0.04 cm
#   Figure 3    guide tube (G) and instrument tube (I) positions
#   Table P2-1  states (as problem 1: Table P1-1)
#   Table P2-2  fuel density 10.257 g/cc, 3.1% enrichment, 1300 ppm boron
#   Table P2-4  number densities (same fuel, gap, clad as problem 1)
#   Table P2-5  CE KENO-VI reference eigenvalues
# The tubes are Zircaloy-4 (Section 1.2) filled with moderator; in 2A-2D the
# instrument tube is empty (2I adds a thimble).
#
# Units: cm, g/cm3, K, atoms per barn-cm, ppm by weight.

[model]
format = 1
name = "VERA problem 2"
description = "Westinghouse 17x17 lattice at beginning of life, 3.1 wt% U-235, no poisons"

# ---------------------------------------------------------------- materials
[materials.fuel]                    # UO2, 10.257 g/cm3 (Table P1-2)
temperature = "fuel"
density = 10.257
formula = { U = 1, O = 2 }
weight_percent.U = { U234 = 0.0263, U235 = 3.1, U236 = 0.0143, U238 = 96.8594 }   # Table P1-3
atom_percent.O = { O16 = 100.0 }

[materials.gap]                     # helium at nominal density (Table P1-4)
temperature = "moderator"           # Table P1-1: clad (and gap) at the moderator temperature
atom_densities = { He4 = 2.68714e-05 }

[materials.clad]                    # Zircaloy-4 (Table P1-4)
temperature = "moderator"
[materials.clad.atom_densities]
Zr90 = 2.18865e-02
Zr91 = 4.77292e-03
Zr92 = 7.29551e-03
Zr94 = 7.39335e-03
Zr96 = 1.19110e-03
Sn112 = 4.68066e-06
Sn114 = 3.18478e-06
Sn115 = 1.64064e-06
Sn116 = 7.01616e-05
Sn117 = 3.70592e-05
Sn118 = 1.16872e-04
Sn119 = 4.14504e-05
Sn120 = 1.57212e-04
Sn122 = 2.23417e-05
Sn124 = 2.79392e-05
Fe54 = 8.68307e-06
Fe56 = 1.36306e-04
Fe57 = 3.14789e-06
Fe58 = 4.18926e-07
Cr50 = 3.30121e-06
Cr52 = 6.36606e-05
Cr53 = 7.21860e-06
Cr54 = 1.79686e-06
Hf174 = 3.54138e-09
Hf176 = 1.16423e-07
Hf177 = 4.11686e-07
Hf178 = 6.03806e-07
Hf179 = 3.01460e-07
Hf180 = 7.76449e-07

[materials.moderator]               # borated water; density and boron from the state
temperature = "moderator"
density = "moderator"
formula = { H = 2, O = 1 }
atom_percent.H = { H1 = 100.0 }
atom_percent.O = { O16 = 100.0 }
soluble_boron.atom_percent.B = { B10 = 19.9, B11 = 80.1 }   # 19.9 at% B-10 (Table 18 note)
thermal = { H1 = "HinH2O" }         # S(alpha, beta) of hydrogen in water

# ---------------------------------------------------------------- pins (Tables 1, 2)
[pins.fuel_rod]
radii = [0.4096, 0.418, 0.475]      # pellet, clad inner, clad outer
materials = ["fuel", "gap", "clad", "moderator"]

[pins.guide_tube]
radii = [0.561, 0.602]
materials = ["moderator", "clad", "moderator"]

[pins.instrument_tube]
radii = [0.559, 0.605]
materials = ["moderator", "clad", "moderator"]

# ---------------------------------------------------------------- lattices (Figure 3)
[lattices.assembly]
pitch = 1.26
gap = 0.04                          # inter-assembly half gap: 17 x 1.26 + 2 x 0.04 = 21.50 cm
legend = { F = "fuel_rod", G = "guide_tube", I = "instrument_tube" }
map = """
F F F F F F F F F F F F F F F F F
F F F F F F F F F F F F F F F F F
F F F F F G F F G F F G F F F F F
F F F G F F F F F F F F F G F F F
F F F F F F F F F F F F F F F F F
F F G F F G F F G F F G F F G F F
F F F F F F F F F F F F F F F F F
F F F F F F F F F F F F F F F F F
F F G F F G F F I F F G F F G F F
F F F F F F F F F F F F F F F F F
F F F F F F F F F F F F F F F F F
F F G F F G F F G F F G F F G F F
F F F F F F F F F F F F F F F F F
F F F G F F F F F F F F F G F F F
F F F F F G F F G F F G F F F F F
F F F F F F F F F F F F F F F F F
F F F F F F F F F F F F F F F F F
"""

# ---------------------------------------------------------------- states (Tables P2-1, P2-5)
# 2A is hot zero power. 2B-2D: 600 K water, fuel at 600, 900, 1200 K.
[states.2A]
fuel_temperature = 565.0
moderator_temperature = 565.0
moderator_density = 0.743
boron_ppm = 1300
reference = { keff = 1.182175, sigma = 0.000017, source = "Table P2-5: CE KENO-VI, ENDF/B-VII.0, 17x17 lattice with gap" }

[states.2B]
fuel_temperature = 600.0
moderator_temperature = 600.0
moderator_density = 0.661
boron_ppm = 1300
reference = { keff = 1.183360, sigma = 0.000024, source = "Table P2-5: CE KENO-VI, ENDF/B-VII.0, 17x17 lattice with gap" }

[states.2C]
fuel_temperature = 900.0
moderator_temperature = 600.0
moderator_density = 0.661
boron_ppm = 1300
reference = { keff = 1.173751, sigma = 0.000023, source = "Table P2-5: CE KENO-VI, ENDF/B-VII.0, 17x17 lattice with gap" }

[states.2D]
fuel_temperature = 1200.0
moderator_temperature = 600.0
moderator_density = 0.661
boron_ppm = 1300
reference = { keff = 1.165591, sigma = 0.000023, source = "Table P2-5: CE KENO-VI, ENDF/B-VII.0, 17x17 lattice with gap" }
