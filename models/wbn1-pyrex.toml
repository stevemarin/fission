# Watts Bar Unit 1 cycle 1 as loaded: the three enrichment zones of
# wbn1-zoned.toml with the Pyrex burnable absorbers of VERA Figure 9.
#
# Source: CASL-U-2012-0131-004 Rev. 4 (free:
# https://corephysics.com/docs/CASL-U-2012-0131-004.pdf): Figure 9 (number
# of Pyrex rods per assembly; their patterns are Figure 5), Table 6 and
# Section 1.4 (the poison runs from 15.761 to 376.441 cm, the fuel stack from
# 11.951 to 377.711 cm: 3.81 cm unpoisoned at the bottom, 1.27 cm at the
# top). Every Pyrex pattern of an enrichment has its own lattice state
# matrix (models/wbn1-fuel-262.toml, wbn1-fuel-310.toml). Guide tubes
# without Pyrex hold water: the thimble plugs and the withdrawn control rods
# are above the fuel.

[model]
extends = "wbn1-zoned"
name = "WBN1 cycle 1 with Pyrex"

[materials.fuel_262_p16]
temperature = "fuel"
table = "wbn1-fuel-262-p16-moc"
[lattices.fuel_262_p16]
material = "fuel_262_p16"
[assemblies.b16]
axial = [{ lattice = "reflector", height = 21.5 }, { lattice = "fuel_262", height = 3.81 },
         { lattice = "fuel_262_p16", height = 360.68 }, { lattice = "fuel_262", height = 1.27 },
         { lattice = "reflector", height = 21.5 }]

