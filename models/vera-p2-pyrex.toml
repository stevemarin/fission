# VERA problem 2 with Pyrex burnable absorbers: cases 2E (12 rods) and 2F
# (24 rods), and every rod pattern of Figure 5 for the Watts Bar core.
#
# Source: CASL-U-2012-0131-004 Rev. 4 (free:
# https://corephysics.com/docs/CASL-U-2012-0131-004.pdf)
#   Table 6     Pyrex rod geometry: SS304 inner tube 0.214-0.231 cm, helium,
#               Pyrex 0.241-0.427 cm, helium, SS304 clad 0.437-0.484 cm
#               (the rod sits in a guide tube, water inside and outside)
#   Table 7     Pyrex isotopics (12.5 wt% B2O3 in SiO2, 2.25 g/cc)
#   Figure 5    rod patterns (octant symmetry); Figure P2-2: 2E = 12, 2F = 24
#   Table P2-1  2E, 2F: fuel and water at 600 K, water 0.743 g/cc, 1300 ppm
#   Table P2-4  Pyrex and SS304 number densities
#   Table P2-5  CE KENO-VI reference eigenvalues
# The inner tube holds helium (Table 6: "plenum material"), at the gap's
# nominal density. C, P, Mn-55, Cr-53, Fe-57 and Fe-58 of the steel are left
# out by the transport code (resonance formats not supported yet).

[model]
extends = "vera-p2"
name = "VERA problem 2, Pyrex"
description = "Westinghouse 17x17 lattice with Pyrex burnable absorber rods"

[materials.pyrex]                   # Table P2-4
temperature = "moderator"
[materials.pyrex.atom_densities]
